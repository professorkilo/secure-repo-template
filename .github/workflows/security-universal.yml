name: Universal Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

# Scheduled runs must never cancel each other; push/PR runs cancel stale siblings.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Least privilege permissions
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history required for secret scanning

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Scope scan to the delta for push/PR; full history for schedule/dispatch.
      - name: Set TruffleHog scan range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TH_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "TH_BASE=HEAD~1" >> "$GITHUB_ENV"
          else
            echo "TH_BASE=" >> "$GITHUB_ENV"
          fi

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb  # v3.99.8
        with:
          path: ./
          base: ${{ env.TH_BASE }}
          head: HEAD
          extra_args: --results=verified,unknown

  file-security:
    name: File Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for credential files
        run: |
          echo "Checking for credential files..."
          FOUND=$(find . -type f \( \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*.p12" -o \
            -name "*.pfx" -o \
            -name "credentials.json" -o \
            -name "secrets.json" -o \
            -name ".env" -o \
            -name "*.keystore" -o \
            -name "*.jks" -o \
            -name "id_rsa" -o \
            -name "id_dsa" \
          \) -not -path "*/node_modules/*" \
             -not -path "*/.git/*" \
             -not -path "*/test/*" \
             -not -path "*/tests/*" \
             2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo "FAIL: Found potentially sensitive files:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: No credential files found"

      - name: Shell Script Security Check
        if: hashFiles('**/*.sh', '**/*.bash') != ''
        run: |
          echo "Scanning shell scripts..."
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . \( -name "*.sh" -o -name "*.bash" \) | while read -r script; do
            echo "Checking: $script"
            shellcheck "$script" || true
          done

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 1. Python
      - name: Python Security Audit
        if: hashFiles('requirements.txt', 'setup.py', 'pyproject.toml', 'Pipfile') != ''
        run: |
          echo "Scanning Python dependencies..."
          python -m pip install --upgrade pip pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc --format json --output python-audit.json || true
            pip-audit -r requirements.txt --desc || true
          elif [ -f setup.py ] || [ -f pyproject.toml ]; then
            pip-audit --desc --format json --output python-audit.json || true
            pip-audit --desc || true
          elif [ -f Pipfile ]; then
            pip install pipenv
            pipenv check || true
          fi

      # 2. Node.js
      - name: Node.js Security Audit
        if: hashFiles('package.json', 'package-lock.json', 'yarn.lock') != ''
        run: |
          echo "Scanning npm dependencies..."
          if [ -f package-lock.json ]; then
            npm audit --audit-level=moderate --json > npm-audit.json || true
            npm audit --audit-level=moderate || true
          elif [ -f yarn.lock ]; then
            yarn audit --json > yarn-audit.json || true
            yarn audit || true
          fi

      # 3. Go modules
      - name: Go Security Audit
        if: hashFiles('go.mod', 'go.sum') != ''
        run: |
          echo "Scanning Go dependencies..."
          if command -v go &> /dev/null; then
            go version
            go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
            govulncheck -json ./... > govulncheck.json || true
            govulncheck ./... || true
          else
            echo "Go not installed, skipping"
          fi

      # 4. Docker
      - name: Docker Security Audit
        if: hashFiles('Dockerfile', 'docker-compose.yml', 'docker-compose.yaml') != ''
        run: |
          echo "Scanning Docker configurations..."
          HADOLINT_VERSION="v2.15.1"
          wget -q "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64" \
            -O /usr/local/bin/hadolint
          wget -q "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/checksums.sha256" \
            -O hadolint_checksums.sha256
          grep 'hadolint-linux-x86_64' hadolint_checksums.sha256 | sha256sum --check
          chmod +x /usr/local/bin/hadolint
          find . -name "Dockerfile*" -not -path "*/node_modules/*" | while read -r dockerfile; do
            echo "Scanning: $dockerfile"
            hadolint "$dockerfile" --format json > "$(basename "$dockerfile")-lint.json" || true
            hadolint "$dockerfile" || true
          done

      # 5. Terraform
      - name: Terraform Security Audit
        if: hashFiles('*.tf', '**/*.tf') != ''
        run: |
          echo "Scanning Terraform configurations..."
          TFSEC_VERSION="v1.28.14"
          wget -q "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64" \
            -O /usr/local/bin/tfsec
          wget -q "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec_checksums.txt" \
            -O tfsec_checksums.txt
          grep 'tfsec-linux-amd64$' tfsec_checksums.txt | sha256sum --check
          chmod +x /usr/local/bin/tfsec
          tfsec . --format json --out tfsec-results.json --soft-fail || true
          tfsec . --soft-fail || true

      # 6. PowerShell / NuGet
      - name: PowerShell/NuGet Security Audit
        if: hashFiles('*.csproj', '*.fsproj', '*.vbproj', 'packages.config', '*.sln') != ''
        run: |
          echo "Scanning .NET/PowerShell dependencies..."
          if command -v dotnet &> /dev/null; then
            dotnet --version
            find . \( -name "*.csproj" -o -name "*.fsproj" \) | while read -r project; do
              echo "Scanning: $project"
              dotnet list "$project" package --vulnerable --format json || true
              dotnet list "$project" package --vulnerable || true
            done
          else
            echo ".NET SDK not installed, skipping"
          fi

      # 7. GitHub Actions (Dependabot handles this; step confirms files present)
      - name: GitHub Actions Check
        if: hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != ''
        run: |
          echo "GitHub Actions workflows detected - monitored by Dependabot"
          find .github/workflows -name "*.yml" -o -name "*.yaml"

      # 8. Rust
      - name: Rust Security Audit
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: |
          echo "Scanning Rust dependencies..."
          if command -v cargo &> /dev/null; then
            cargo --version
            cargo install cargo-audit --version 0.21.0
            cargo audit --json > cargo-audit.json || true
            cargo audit || true
          else
            echo "Rust/Cargo not installed, skipping"
          fi

      - name: Upload Audit Reports
        if: always()
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8  # v4.3.0
        with:
          name: security-audit-reports
          path: |
            *-audit.json
            *-lint.json
            *-results.json
            govulncheck.json
            tfsec-results.json
          retention-days: 30
          if-no-files-found: ignore
