name: OSSF Scorecard

on:
  schedule:
    - cron: '30 1 * * 1'  # Weekly on Monday
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # publish_results: true requires a public repo and publishes to deps.dev
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 30

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@52cf1852265d99e9bea071b03366fc777a602909  # codeql-bundle-v2.27.4
        with:
          sarif_file: scorecard.sarif
          category: ossf-scorecard
